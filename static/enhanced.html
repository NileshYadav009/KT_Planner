<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KT Planner v2.0 - Advanced Knowledge Transfer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0a66c2;
            --accent: #0b8a72;
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #0f1724;
            --muted: #6b7280;
            --border: #e6eefc;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --green: #10b981;
            --yellow: #fbbf24;
            --red: #ef4444;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #ffffff 100%);
            color: var(--text);
            line-height: 1.6;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 4px 12px rgba(10, 102, 194, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px 32px;
            max-width: 1600px;
            margin: 0 auto;
            height: calc(100vh - 80px);
        }
        
        .panel {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #fafbff 0%, #ffffff 100%);
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        /* Upload Section */
        #uploadPanel {
            grid-column: 1 / -1;
        }
        
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(10,102,194,0.02), rgba(11,138,114,0.02));
        }
        
        .upload-area:hover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(10,102,194,0.04), rgba(11,138,114,0.04));
        }
        
        .upload-area.dragging {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(10,102,194,0.08), rgba(11,138,114,0.08));
        }
        
        /* Progress Bar */
        .progress-container {
            display: none;
            margin-top: 16px;
        }
        
        .progress-bar {
            background: var(--border);
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s;
        }
        
        /* Sentence List */
        .sentence {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: grab;
            transition: all 0.2s;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        
        .sentence:hover {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-color: var(--primary);
        }
        
        .sentence.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        
        .sentence-confidence {
            font-weight: 700;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 32px;
            text-align: center;
        }
        
        .sentence-confidence.high {
            background: rgba(16, 185, 129, 0.1);
            color: var(--green);
        }
        
        .sentence-confidence.medium {
            background: rgba(251, 191, 36, 0.1);
            color: var(--yellow);
        }
        
        .sentence-confidence.low {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
        }
        
        .sentence-content {
            flex: 1;
        }
        
        .sentence-text {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.5;
        }
        
        .sentence-meta {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            gap: 12px;
        }
        
        .sentence-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(10, 102, 194, 0.1);
            color: var(--primary);
            border-radius: 4px;
            font-weight: 500;
        }
        
        .sentence-confusing {
            border-left: 4px solid var(--red);
            background: rgba(239, 68, 68, 0.02);
        }
        
        .sentence-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .sentence:hover .sentence-actions {
            opacity: 1;
        }
        
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: #f3f4f6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .icon-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        /* KT Sections */
        .kt-section {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            min-height: 60px;
        }
        
        .kt-section-header {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .kt-section-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        
        .kt-section-status.covered {
            background: rgba(16, 185, 129, 0.1);
            color: var(--green);
        }
        
        .kt-section-status.weak {
            background: rgba(251, 191, 36, 0.1);
            color: var(--yellow);
        }
        
        .kt-section-status.missing {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
        }
        
        .kt-section.drag-over {
            background: rgba(10, 102, 194, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.1);
        }
        
        .kt-sentence {
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin: 6px 0;
            font-size: 13px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.open {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }
        
        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.1);
        }
        
        textarea.form-input {
            resize: vertical;
            min-height: 100px;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        /* Code Panel */
        .code-panel {
            background: #1e1e2e;
            color: #d4d4d4;
            border-radius: 6px;
            padding: 12px;
            margin: 6px 0;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: #fafbff;
        }
        
        .tab {
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab:hover {
            color: var(--text);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .alert-warning {
            background: rgba(251, 191, 36, 0.1);
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }
        
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 KT Planner v2.0</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="showExportModal()">📥 Export</button>
            <button class="btn btn-secondary" onclick="showVersions()">📜 Versions</button>
            <button class="btn btn-primary" onclick="showUpload()">📤 New Upload</button>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <!-- LEFT PANEL: Transcript with Smart Segmentation -->
        <div class="panel">
            <div class="panel-header">
                📝 Intelligence Transcript
                <span class="stat-value" style="font-size: 14px; color: var(--muted);" id="sentenceCount">0</span>
            </div>
            <div class="panel-content">
                <div class="stats" id="sidebarStats">
                    <div class="stat">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Mapped</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Confusing</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">0%</div>
                        <div class="stat-label">Confidence</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Code Refs</div>
                    </div>
                </div>
                
                <div id="sentenceList">
                    <!-- Sentences will be populated here -->
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: KT Sections with Drop Zones -->
        <div class="panel">
            <div class="panel-header">
                📚 KT Sections
                <button class="icon-btn" onclick="refreshSections()" title="Refresh">🔄</button>
            </div>
            <div class="panel-content" id="ktSections">
                <!-- KT sections will be populated here -->
            </div>
        </div>
    </div>

    <!-- Upload Section (Initial Screen) -->
    <div id="uploadPanel" class="panel" style="margin: 24px 32px; max-width: 600px; margin-left: auto; margin-right: auto;">
        <div class="panel-header">Upload Knowledge Transfer Material</div>
        <div class="panel-content">
            <div class="upload-area" id="uploadArea" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <div style="font-size: 48px; margin-bottom: 12px;">🎙️</div>
                <div style="font-weight: 600; margin-bottom: 6px;">Drop audio file here</div>
                <div style="color: var(--muted); font-size: 14px; margin-bottom: 16px;">or click to browse</div>
                <input type="file" id="fileInput" accept="audio/*" hidden onchange="handleFileSelect(event)">
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Choose File</button>
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div style="font-size: 14px; color: var(--muted); text-align: center;" id="progressText">Uploading...</div>
            </div>
        </div>
    </div>

    <!-- Edit Sentence Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                Edit Sentence
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="form-group">
                <div class="form-label">Current Text:</div>
                <div id="currentText" style="padding: 10px; background: #f3f4f6; border-radius: 6px; font-size: 14px;"></div>
            </div>
            <div class="form-group">
                <label class="form-label">New Text:</label>
                <textarea class="form-input" id="editText"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Assign to Section:</label>
                <select class="form-input" id="editSection"></select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSentenceEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Code Link Modal -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                Link Code/Log Reference
                <button class="modal-close" onclick="closeCodeModal()">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">File Name:</label>
                <input type="text" class="form-input" id="codeFileName" placeholder="config.yaml, deploy.sh, etc.">
            </div>
            <div class="form-group">
                <label class="form-label">Language:</label>
                <select class="form-input" id="codeLanguage">
                    <option>bash</option>
                    <option>yaml</option>
                    <option>json</option>
                    <option>python</option>
                    <option>sql</option>
                    <option>text</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Code/Log Content:</label>
                <textarea class="form-input" id="codeContent" placeholder="Paste code or log snippet..." style="font-family: monospace; font-size: 12px; min-height: 150px;"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCodeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveCodeReference()">Link Code</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                Export Knowledge Transfer
                <button class="modal-close" onclick="closeExportModal()">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">Select Export Formats:</label>
                <div style="display: grid; gap: 10px;">
                    <label style="display: flex; gap: 8px;">
                        <input type="checkbox" id="exportMarkdown" checked>
                        <span>📄 Markdown Documentation</span>
                    </label>
                    <label style="display: flex; gap: 8px;">
                        <input type="checkbox" id="exportSOP" checked>
                        <span>📋 SOP/Runbook</span>
                    </label>
                    <label style="display: flex; gap: 8px;">
                        <input type="checkbox" id="exportJSON" checked>
                        <span>{"} JSON Export</span>
                    </label>
                    <label style="display: flex; gap: 8px;">
                        <input type="checkbox" id="exportHTML">
                        <span>🌐 HTML Report</span>
                    </label>
                    <label style="display: flex; gap: 8px;">
                        <input type="checkbox" id="exportChecklist">
                        <span>☑️ Coverage Checklist</span>
                    </label>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeExportModal()">Cancel</button>
                <button class="btn btn-primary" onclick="performExport()">Generate Exports</button>
            </div>
        </div>
    </div>

    <script>
        let currentJobId = null;
        let sentences = [];
        let sections = [];
        let editingSentenceId = null;
        let codeReferenceSentenceId = null;

        // Upload handling
        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragging');
        }

        function handleDragLeave(e) {
            document.getElementById('uploadArea').classList.remove('dragging');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragging');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFileUpload(files[0]);
        }

        function handleFileSelect(e) {
            if (e.target.files.length > 0) handleFileUpload(e.target.files[0]);
        }

        async function handleFileUpload(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                document.getElementById('progressContainer').style.display = 'block';
                
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                currentJobId = data.job_id;

                // Poll for completion
                pollJobStatus();
            } catch (error) {
                showAlert('Upload failed: ' + error.message, 'warning');
            }
        }

        async function pollJobStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`/status/${currentJobId}`);
                const job = await response.json();

                const progress = job.progress || 0;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent = progress + '% - ' + (job.status || 'processing');

                if (job.status === 'completed') {
                    loadJob();
                } else if (job.status === 'failed') {
                    showAlert('Job failed: ' + job.error, 'warning');
                } else {
                    setTimeout(pollJobStatus, 1000);
                }
            } catch (error) {
                console.error('Poll error:', error);
                setTimeout(pollJobStatus, 2000);
            }
        }

        async function loadJob() {
            try {
                // Load sentences metadata
                const sentRes = await fetch(`/sentences/${currentJobId}`);
                const sentData = await sentRes.json();
                sections = sentData.sentences;

                // Load KT sections
                const ktRes = await fetch(`/coverage/${currentJobId}`);
                const ktData = await ktRes.json();

                document.getElementById('uploadPanel').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'grid';

                renderSentences(sentData.sentences);
                renderSections(ktData.coverage_by_section);

                // Update stats
                updateStats(sentData.statistics);
            } catch (error) {
                showAlert('Failed to load data: ' + error.message, 'warning');
            }
        }

        function renderSentences(sentList) {
            const list = document.getElementById('sentenceList');
            list.innerHTML = '';

            sentList.forEach(sent => {
                const confLevel = sent.confidence > 0.8 ? 'high' : sent.confidence > 0.6 ? 'medium' : 'low';
                const confEmoji = confLevel === 'high' ? '🟢' : confLevel === 'medium' ? '🟡' : '🔴';

                const div = document.createElement('div');
                div.className = `sentence${sent.is_confusing ? ' sentence-confusing' : ''}`;
                div.draggable = true;
                div.id = `sent-${sent.id}`;
                div.addEventListener('dragstart', (e) => dragStart(e, sent));
                div.addEventListener('dragend', dragEnd);

                div.innerHTML = `
                    <div class="sentence-confidence ${confLevel}">${confEmoji}</div>
                    <div class="sentence-content">
                        <div class="sentence-text">${sent.text}</div>
                        <div class="sentence-meta">
                            <span class="sentence-tag">${sent.predicted_section}</span>
                            <span>${(sent.confidence * 100).toFixed(0)}% conf</span>
                            ${sent.is_confusing ? '<span style="color: var(--red); font-weight: 600;">⚠️ Confusing</span>' : ''}
                        </div>
                    </div>
                    <div class="sentence-actions">
                        <button class="icon-btn" onclick="editSentence('${sent.id}')" title="Edit">✏️</button>
                        <button class="icon-btn" onclick="linkCode('${sent.id}')" title="Link Code">🔗</button>
                        <button class="icon-btn" onclick="markConfusing('${sent.id}')" title="Mark Confusing">❌</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function renderSections(sectionCoverage) {
            const container = document.getElementById('ktSections');
            container.innerHTML = '';

            Object.entries(sectionCoverage).forEach(([sectionId, section]) => {
                const status = section.status === 'covered' ? 'covered' : section.status === 'weak' ? 'weak' : 'missing';
                
                const div = document.createElement('div');
                div.className = 'kt-section';
                div.id = `section-${sectionId}`;
                div.addEventListener('dragover', (e) => dragOver(e));
                div.addEventListener('drop', (e) => drop(e, sectionId));
                div.addEventListener('dragleave', (e) => dragLeave(e));

                div.innerHTML = `
                    <div class="kt-section-header">
                        <span>${section.title}</span>
                        <span class="kt-section-status ${status}">${status.toUpperCase()}</span>
                    </div>
                    <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">
                        ${section.sentence_count} sentences • ${(section.confidence * 100).toFixed(0)}% confidence
                    </div>
                    <div class="kt-sentences" id="sentences-${sectionId}">
                        ${(section.sentences || []).map(s => `
                            <div class="kt-sentence">
                                ${typeof s === 'string' ? s : s.text}
                                <button class="icon-btn" style="width: 24px; height: 24px;" onclick="removeSentenceFromSection('${sectionId}', this)">×</button>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateStats(stats) {
            const statsDiv = document.getElementById('sidebarStats');
            const mapped = stats.mapped_sentences || 0;
            const confusing = stats.confusing_sentences || 0;
            const avgConf = ((stats.average_confidence || 0) * 100).toFixed(0);
            const codeRefs = stats.code_references || 0;

            statsDiv.innerHTML = `
                <div class="stat">
                    <div class="stat-value">${mapped}</div>
                    <div class="stat-label">Mapped</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${confusing}</div>
                    <div class="stat-label">Confusing</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${avgConf}%</div>
                    <div class="stat-label">Confidence</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${codeRefs}</div>
                    <div class="stat-label">Code Refs</div>
                </div>
            `;
        }

        // Drag-drop handlers
        let draggedSentence = null;

        function dragStart(e, sent) {
            draggedSentence = sent;
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('dragging');
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (e.target.closest('.kt-section')) {
                e.target.closest('.kt-section').classList.add('drag-over');
            }
        }

        function dragLeave(e) {
            if (e.target.classList && e.target.classList.contains('kt-section')) {
                e.target.classList.remove('drag-over');
            }
        }

        async function drop(e, sectionId) {
            e.preventDefault();
            e.target.closest('.kt-section').classList.remove('drag-over');

            if (!draggedSentence || !currentJobId) return;

            try {
                const response = await fetch(`/sentences/${currentJobId}/drag-drop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        job_id: currentJobId,
                        sentence_id: draggedSentence.id,
                        target_section: sectionId,
                        user: 'user'
                    })
                });

                if (response.ok) {
                    showAlert('✅ Sentence assigned!' , 'success');
                    loadJob(); // Refresh
                }
            } catch (error) {
                showAlert('Drop failed: ' + error.message, 'warning');
            }
        }

        // Edit sentence
        function editSentence(sentId) {
            editingSentenceId = sentId;
            const sent = sections.find(s => s.id === sentId);
            if (!sent) return;

            document.getElementById('currentText').textContent = sent.text;
            document.getElementById('editText').value = sent.text;

            // Populate section dropdown
            const select = document.getElementById('editSection');
            select.innerHTML = sent.alternatives.map(alt => 
                `<option value="${alt.section}">${alt.section} (${(alt.score * 100).toFixed(0)}%)</option>`
            ).join('');
            select.value = sent.predicted_section;

            document.getElementById('editModal').classList.add('open');
        }

        async function saveSentenceEdit() {
            const newText = document.getElementById('editText').value;
            const section = document.getElementById('editSection').value;

            try {
                await fetch(`/sentences/${currentJobId}/edit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        job_id: currentJobId,
                        sentence_id: editingSentenceId,
                        new_text: newText,
                        user: 'user'
                    })
                });

                closeEditModal();
                showAlert('✅ Sentence updated!', 'success');
                loadJob();
            } catch (error) {
                showAlert('Save failed: ' + error.message, 'warning');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
        }

        // Code linking
        function linkCode(sentId) {
            codeReferenceSentenceId = sentId;
            document.getElementById('codeModal').classList.add('open');
        }

        async function saveCodeReference() {
            const fileName = document.getElementById('codeFileName').value;
            const language = document.getElementById('codeLanguage').value;
            const content = document.getElementById('codeContent').value;

            if (!fileName || !content) {
                showAlert('Please fill in all fields', 'warning');
                return;
            }

            try {
                await fetch(`/sentences/${currentJobId}/link-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        job_id: currentJobId,
                        sentence_id: codeReferenceSentenceId,
                        code_block: content,
                        file_name: fileName,
                        language: language
                    })
                });

                closeCodeModal();
                showAlert('✅ Code linked!', 'success');
            } catch (error) {
                showAlert('Link failed: ' + error.message, 'warning');
            }
        }

        function closeCodeModal() {
            document.getElementById('codeModal').classList.remove('open');
        }

        // Mark confusing
        async function markConfusing(sentId) {
            try {
                await fetch(`/sentences/${currentJobId}/mark-confusing`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        job_id: currentJobId,
                        sentence_id: sentId,
                        user: 'user'
                    })
                });

                showAlert('⚠️ Marked as confusing', 'warning');
                loadJob();
            } catch (error) {
                showAlert('Mark failed: ' + error.message, 'warning');
            }
        }

        // Export
        function showExportModal() {
            if (!currentJobId) {
                showAlert('Please upload a file first', 'warning');
                return;
            }
            document.getElementById('exportModal').classList.add('open');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('open');
        }

        async function performExport() {
            const formats = [];
            if (document.getElementById('exportMarkdown').checked) formats.push('markdown');
            if (document.getElementById('exportSOP').checked) formats.push('sop');
            if (document.getElementById('exportJSON').checked) formats.push('json');
            if (document.getElementById('exportHTML').checked) formats.push('html');
            if (document.getElementById('exportChecklist').checked) formats.push('checklist');

            try {
                const response = await fetch(`/export/${currentJobId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: currentJobId, formats: formats })
                });

                const data = await response.json();
                showAlert('✅ Exports ready! Download them from the response.', 'success');
                console.log('Export data:', data);
            } catch (error) {
                showAlert('Export failed: ' + error.message, 'warning');
            }
        }

        // Versions
        function showVersions() {
            if (!currentJobId) {
                showAlert('Please upload a file first', 'warning');
                return;
            }
            showAlert('📜 Version management coming soon!', 'warning');
        }

        function showUpload() {
            document.getElementById('uploadPanel').style.display = 'block';
            document.getElementById('mainContainer').style.display = 'none';
            currentJobId = null;
        }

        // Utilities
        function showAlert(message, type = 'success') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            alert.style.position = 'fixed';
            alert.style.top = '100px';
            alert.style.right = '24px';
            alert.style.maxWidth = '300px';
            alert.style.zIndex = '999';
            document.body.appendChild(alert);

            setTimeout(() => alert.remove(), 3000);
        }

        function refreshSections() {
            if (currentJobId) loadJob();
        }

        function removeSentenceFromSection(sectionId, btn) {
            btn.parentElement.remove();
        }
    </script>
</body>
</html>
