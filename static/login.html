<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Continuum</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --border:#dde3f0; --text:#0f172a; --text2:#3d4a63; --text3:#6b7280;
    --blue:#2563eb; --blue-dk:#1d4ed8; --red:#b91c1c; --red-dim:#fee2e2; --focus:rgba(37,99,235,.35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0a0f1c; --surface:#111827; --border:#263248; --text:#e8ecf5; --text2:#b4bfd3; --text3:#8a96ab;
           --blue:#5b9bff; --blue-dk:#7fb1ff; --red:#f87171; --red-dim:rgba(248,113,113,.14); --focus:rgba(91,155,255,.4);
           color-scheme: dark; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
       font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
        padding:28px 26px;box-shadow:0 16px 40px rgba(15,23,42,.10)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
  .brand b{font-size:17px} .brand span{color:var(--text3);font-size:13px;margin-left:2px}
  h1{font-size:20px;margin:0 0 6px} p.lead{margin:0 0 20px;color:var(--text2);font-size:14px;line-height:1.5}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
        color:var(--text);font:inherit;font-size:14px}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus)}
  button{margin-top:16px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:var(--blue);color:#fff;
         font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  button:hover{background:var(--blue-dk)} button:disabled{opacity:.6;cursor:default}
  button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
  .error{display:none;margin-top:14px;padding:9px 12px;border-radius:8px;background:var(--red-dim);color:var(--red);font-size:13px}
  .help{margin-top:20px;font-size:12.5px;color:var(--text3);line-height:1.55}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">C</div><b>Continuum</b><span>KT Planner</span></div>
  <h1>Sign in</h1>
  <p class="lead">Enter your workspace API key. You only see knowledge transfers that belong to your workspace.</p>
  <form id="loginForm" autocomplete="off">
    <label for="apiKey">API key</label>
    <input id="apiKey" name="apiKey" type="password" placeholder="ckt_…" required autofocus spellcheck="false">
    <button id="submitBtn" type="submit">Sign in</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <p class="help">Don't have a key? Ask your workspace admin. Admins create one on the server with
    <code>python -m auth create-tenant "Team name"</code>.</p>
</main>
<script>
  const form = document.getElementById('loginForm');
  const input = document.getElementById('apiKey');
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('error');
  // Keys from the old in-browser storage are no longer used.
  try { localStorage.removeItem('kt-api-key'); } catch (e) {}
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const resp = await fetch('/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({api_key: input.value.trim()}), credentials: 'same-origin',
      });
      if (resp.ok) { window.location.replace('/'); return; }
      const data = await resp.json().catch(() => ({}));
      err.textContent = data.detail || 'Sign-in failed. Check the key and try again.';
      err.style.display = 'block';
    } catch (ex) {
      err.textContent = 'Could not reach the server. Try again in a moment.';
      err.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
