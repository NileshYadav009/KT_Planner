# P1-5: every push and pull request runs the test suite (golden suite
# included) from the pinned lock, then builds the image and checks that it
# becomes ready with networking switched off.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      # Tests never call an LLM: with no key the pipeline runs deterministically.
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: System packages (ffmpeg, PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation2

      - name: Python packages from the lock
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "$(grep '^torch==' requirements.lock)"
          pip install -r requirements.lock

      - name: The lock matches requirements.txt
        run: |
          cp requirements.lock /tmp/committed.lock
          python scripts/lock_requirements.py
          diff -u /tmp/committed.lock requirements.lock

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .hf
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Models at pinned revisions
        run: python scripts/fetch_models.py && python scripts/fetch_models.py --verify

      - name: Tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q -p no:cacheprovider

  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t continuum:ci .

      - name: Ready with no network
        run: |
          docker run -d --name continuum --network none continuum:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' continuum)
            echo "health: $status"
            if [ "$status" = healthy ]; then
              docker exec continuum python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz').read().decode())"
              exit 0
            fi
            if [ "$status" = unhealthy ] || [ "$(docker inspect --format '{{.State.Running}}' continuum)" != true ]; then
              break
            fi
            sleep 10
          done
          docker logs continuum
          exit 1

      - name: Runs as a non-root user
        run: test "$(docker exec continuum id -u)" = 10001
